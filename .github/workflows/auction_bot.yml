name: Pokemon Auction Digest Bot

on:
  schedule:
    - cron: '0 10 * * *' # Запуск раз в сутки в 10:00 UTC
  workflow_dispatch:

# Обязательно даем боту права на запись (push) в репозиторий
permissions:
  contents: write

jobs:
  run-digest-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python bot.py

      - name: Save history state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sent_links.txt || exit 0
          git commit -m "Update sent links history" || exit 0
          git push
